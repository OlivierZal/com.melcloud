# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  review:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-code-review.yml@76559db426286aab1f8e5ae8b0f98346cd9dfd2b # v6.0.0
name: claude-code-review
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
permissions: {}
