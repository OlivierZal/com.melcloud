# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  review:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-code-review.yml@acc28526c5c39ee5adc1dce7a81f1b8f4341645b # v8.4.0
name: claude-code-review
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
permissions: {}
