# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  review:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-code-review.yml@f9bba5c0c57b72f30b10fa38e35c48aa0e4024fb # v9.0.1
name: claude-code-review
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
permissions: {}
