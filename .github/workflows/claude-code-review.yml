# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  review:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-code-review.yml@1b0e5b4f303b76a102d1187448cda1e0d4d05b8b # v8.0.0
name: claude-code-review
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
permissions: {}
