# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  review:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-code-review.yml@0d30d2ae20ce40a93347a684d50cdd717a5dbf7b # v7.2.0
name: claude-code-review
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
permissions: {}
