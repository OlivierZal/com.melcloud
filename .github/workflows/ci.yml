# Calls the family's reusable CI (both legs on the Homey runtime).
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-ci.yml@2acd68afe1a72f8bfdabdab88ba18f213b2927db # v1.4.0
    with:
      check-node-version: '22'
      coverage-node-version: '22'
name: CI
on:
  merge_group: {}
  pull_request: {}
  push:
    branches: [main]
permissions: {}
