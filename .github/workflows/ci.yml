# Calls the family's reusable CI (both legs on the Homey runtime).
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-ci.yml@802b7e1bd61d37420efa982eb471356711b46251 # v3.2.0
    with:
      check-node-version: '22'
      # The coverage/Sonar leg carries its own flag, and it runs on the
      # fleet's FLOOR rather than lts/*: 22.20 (Pro 2019) against 22.23
      # (Pro 2023), both measured on-device (2026-08). A bare '22'
      # resolves to the head of the line and drifts off that floor at
      # every release. Quoting stays load-bearing: unquoted, JSON reads
      # 22.20 as the number 22.2 — a three-year-old release — and the
      # leg would name itself after it.
      node-versions: '[{"node-version": "22"}, {"node-version": "22.20", "coverage": true}, {"node-version": "latest"}, {"node-version": "lts/*"}]'
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
