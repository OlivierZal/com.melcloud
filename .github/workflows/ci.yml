# Calls the family's reusable CI (both legs on the Homey runtime).
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-ci.yml@571d0d1b4802e5620508c3253ef90181e005b066 # v8.12.0
    with:
      check-node-version: '22'
      # The coverage/Sonar leg carries its own flag, and it runs on the
      # fleet's FLOOR rather than lts/*: 22.20 (Pro 2019) against 22.23
      # (Pro 2023), both measured on-device (2026-08). A bare '22'
      # resolves to the head of the line and drifts off that floor at
      # every release. Quoting stays load-bearing: unquoted, JSON reads
      # 22.20 as the number 22.2 — a three-year-old release — and the
      # leg would name itself after it.
      node-versions: >-
        [{"node-version": "22"}, {"node-version": "22.20", "coverage": true},
        {"node-version": "latest"}, {"node-version": "lts/*"}]
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
  # The push the Dependabot lane never raises: a merge it performs is
  # pushed with `GITHUB_TOKEN`, which starts no workflow.
  schedule:
    - cron: '23 4 * * *'
permissions: {}
