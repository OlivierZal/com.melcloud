# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@cabbcc9146dbf0e4bec2ed8b7a261aef62cfbafa # v6.4.1
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
