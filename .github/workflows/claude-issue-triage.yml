# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@2c0fa6ef42cb50088099135d35faf4eedd633b5a # v8.3.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
