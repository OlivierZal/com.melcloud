# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@9694058671544cdf0624f608c376635e03ee4ab6 # v9.0.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
