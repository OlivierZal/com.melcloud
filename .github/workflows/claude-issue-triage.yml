# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@eb3af974655875cb5b993cf8e7bb65f38b0f95d5 # v8.6.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
