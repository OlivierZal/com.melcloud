# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@6570fe2d0d758a1734b6fe578788a50e402b8d31 # v8.2.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
