# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@fec6cb6f6314305339ebf7fef322da2080e5cbba # v8.11.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
