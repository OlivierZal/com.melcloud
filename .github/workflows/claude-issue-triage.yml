# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@1c1c1108e004e63b1acebc89b34fc69551f9483a # v8.1.1
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
