# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@5e246c3e387dbb6f0be8a861fcee4bbb1176cc00 # v7.0.1
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
