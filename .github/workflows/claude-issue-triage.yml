# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@f14c906e6db9327fb6a865911c994b645f15fd08 # v8.5.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
