# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@0d30d2ae20ce40a93347a684d50cdd717a5dbf7b # v7.2.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
