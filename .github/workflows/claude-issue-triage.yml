# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@291dd9e28a6da8fe861d1ef9b4c21a5d4e813c3d # v7.1.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
