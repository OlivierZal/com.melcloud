# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@1b0e5b4f303b76a102d1187448cda1e0d4d05b8b # v8.0.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
