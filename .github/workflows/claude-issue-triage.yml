# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@9b69e8520dfd11484df292ca75c10d51beba75ca # v6.3.1
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
