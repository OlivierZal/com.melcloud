# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@76559db426286aab1f8e5ae8b0f98346cd9dfd2b # v6.0.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
