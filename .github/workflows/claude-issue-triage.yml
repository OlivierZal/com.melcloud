# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@571d0d1b4802e5620508c3253ef90181e005b066 # v8.12.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
