# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@2ea1b323f0428e1a86ca932e689e852c69278bb1 # v6.6.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
