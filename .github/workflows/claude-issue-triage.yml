# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@d16eeb9fc509675429d325016c86038e555dc69e # v7.0.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
