# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@f691686d44753b0dfb00a155c42ea66d89d78a1e # v6.1.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
