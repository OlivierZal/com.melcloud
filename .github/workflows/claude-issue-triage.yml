# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@a2ee75bd9cd4b8062b993e2ea488883c2863a2c5 # v6.2.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
