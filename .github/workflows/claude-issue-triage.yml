# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@83677ba411dc01903f5cfe02ae8f7b2eacc0a81f # v8.8.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
