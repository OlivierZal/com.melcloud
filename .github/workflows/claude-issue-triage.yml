# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@acc28526c5c39ee5adc1dce7a81f1b8f4341645b # v8.4.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
