# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@69361d84fae1d0d460da2308d41c140c0762a38b # v6.5.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
