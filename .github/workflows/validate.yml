concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: validate-${{ github.ref }}
jobs:
  validate:
    permissions:
      contents: read
      packages: read
    uses: OlivierZal/homey-kit/.github/workflows/reusable-homey-validate.yml@fd13297589659e3207f9215548276b70beccd17e # v9.1.0
name: Validate
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
