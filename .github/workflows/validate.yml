concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: validate-${{ github.ref }}
jobs:
  validate:
    permissions:
      contents: read
      packages: read
    uses: OlivierZal/homey-kit/.github/workflows/reusable-homey-validate.yml@7efc6d3b9735fc06de8259b127b1c25b32e13258 # v9.0.0
name: Validate
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
