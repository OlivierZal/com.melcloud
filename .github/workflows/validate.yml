concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: validate-${{ github.ref }}
jobs:
  validate:
    permissions:
      contents: read
      packages: read
    uses: OlivierZal/homey-kit/.github/workflows/reusable-homey-validate.yml@2a7fb082127e14944a3ccf3199aebafeb9c8e211 # v10.0.0
name: Validate
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
