concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: validate-${{ github.ref }}
jobs:
  validate:
    permissions:
      contents: read
      packages: read
    uses: OlivierZal/homey-kit/.github/workflows/reusable-homey-validate.yml@2265be06081de64e375e51a6acd259d45a3e87cb # v6.1.0
name: Validate
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
