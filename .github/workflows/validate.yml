concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: validate-${{ github.ref }}
jobs:
  validate:
    permissions:
      contents: read
      packages: read
    uses: OlivierZal/homey-kit/.github/workflows/reusable-homey-validate.yml@0616ab5113adaffdd9ed962a800c14dbb920c756 # v8.0.0
name: Validate
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
