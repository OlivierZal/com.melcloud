# workflow_run (not pull_request) is deliberate: dependabot-triggered runs
# get a read-only token and only dependabot secrets, so they cannot reach
# CLAUDE_CODE_OAUTH_TOKEN — this run executes in the default-branch context
# instead. Claude pushes through its GitHub App token, which re-triggers CI
# (a GITHUB_TOKEN push would not), and the dependabot auto-merge workflow
# then completes the loop once green.
concurrency:
  cancel-in-progress: false
  group: claude-dependabot-fix-${{ github.event.workflow_run.head_branch }}
jobs:
  fix:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-claude-dependabot-fix.yml@8e7ae72e9efcbb5b201ea9e43e248ea5f9d2da76 # v4.1.0
    with:
      repo-guidance: 'API bugs surfacing through @olivierzal/melcloud-api are fixed in that library, never worked around in this app. When the bump is @olivierzal/configs, realign every `uses: OlivierZal/configs/...` ref in .github/workflows to the tag matching the new npm pin, comment included — one version covers both channels. Stop and leave the pull request failing for human review when that release changes lint policy: adopting it needs per-repository judgement no automated fix can make.'
      verify-commands: '`npm run format`, `npm run lint`, `npm run typecheck`, `npm test`, and `npm run build`'
name: Claude Dependabot Fix
on:
  workflow_run:
    types: [completed]
    # The repo's two always-running required build gates (see ruleset).
    workflows: [CI, Validate]
permissions: {}
