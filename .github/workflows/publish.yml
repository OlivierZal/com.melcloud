jobs:
  publish:
    permissions:
      contents: read
      packages: read
    secrets:
      HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
    uses: OlivierZal/homey-kit/.github/workflows/reusable-homey-publish.yml@2265be06081de64e375e51a6acd259d45a3e87cb # v6.1.0
    with:
      bundles: |
        settings/index.js
        settings/index.mjs
        widgets/ata-group-setting/public/index.js
        widgets/ata-group-setting/public/index.mjs
        widgets/charts/public/index.js
        widgets/charts/public/index.mjs
name: Publish app on Homey
on:
  release:
    types: [published]
  workflow_dispatch: {}
permissions: {}
