jobs:
  publish:
    permissions:
      contents: read
      packages: read
    secrets:
      HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
    uses: OlivierZal/homey-kit/.github/workflows/reusable-homey-publish.yml@eeddc9c50810f7a54dc3862fa328d621e6200406 # v7.0.0
    with:
      bundles: |
        settings/index.js
        settings/index.mjs
        widgets/ata-group-setting/public/index.js
        widgets/ata-group-setting/public/index.mjs
        widgets/charts/public/index.js
        widgets/charts/public/index.mjs
name: Publish app on Homey
on:
  release:
    types: [published]
  workflow_dispatch: {}
permissions: {}
