jobs:
  build-link:
    needs: publish
    permissions:
      actions: read
    uses: OlivierZal/homey-kit/.github/workflows/reusable-homey-build-link.yml@fd13297589659e3207f9215548276b70beccd17e # v9.1.0
  publish:
    permissions:
      contents: read
      packages: read
    secrets:
      HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
    uses: OlivierZal/homey-kit/.github/workflows/reusable-homey-publish.yml@fd13297589659e3207f9215548276b70beccd17e # v9.1.0
    with:
      bundles: |
        settings/index.js
        settings/index.mjs
        widgets/ata-group-setting/public/index.js
        widgets/ata-group-setting/public/index.mjs
        widgets/charts/public/index.js
        widgets/charts/public/index.mjs
name: Publish app on Homey
on:
  release:
    types: [published]
  workflow_dispatch: {}
permissions: {}
